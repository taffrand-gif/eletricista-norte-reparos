name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build
      run: npm run build

    - name: Sitemap and IndexNow drift guard
      run: |
        git fetch --no-tags origin main:refs/remotes/origin/main
        node --test scripts/check-sitemap-drift.test.mjs
        node scripts/check-sitemap-drift.mjs --base origin/main
