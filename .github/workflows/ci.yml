name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build
      run: npm run build

    - name: Sitemap and IndexNow drift guard
      # pull_request: HEAD is the tested merge ref, HEAD^1 its main parent (stable
      # even if main moves during the run). push: HEAD, as before (no-op).
      env:
        DRIFT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
      run: |
        node --test scripts/check-sitemap-drift.test.mjs
        node scripts/check-sitemap-drift.mjs --base "$DRIFT_BASE"
